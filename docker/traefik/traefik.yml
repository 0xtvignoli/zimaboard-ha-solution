api:
  dashboard: true
  insecure: true # For local testing, remove in production with proper auth

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "websecure"
          scheme: "https"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  myresolver:
    acme:
      email: "your-email@example.com" # CHANGE THIS
      storage: "/etc/traefik/acme.json"
      # For HA, use a distributed key-value store like Consul or Etcd
      # httpChallenge:
      #   entryPoint: web
      tlsChallenge: {}
      # caServer: "https://acme-staging-v02.api.letsencrypt.org/directory" # Uncomment for testing

