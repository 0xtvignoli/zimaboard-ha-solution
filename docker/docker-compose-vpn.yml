version: "3.8"

services:
  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - SERVERURL=your-vpn-domain.com # CHANGE THIS (e.g., your DDNS domain)
      - SERVERPORT=51820 # CHANGE THIS if needed
      - PEERS=client1,client2 # Comma separated list of client names
      - PEERDNS=1.1.1.1 # DNS server for VPN clients
      - INTERNAL_SUBNET=10.13.13.0/24 # Internal VPN subnet
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp # CHANGE THIS if SERVERPORT is changed
    sysctls:
      - net.ipv4.conf.all.src_valid_lables=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

