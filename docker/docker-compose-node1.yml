version: '3.8'

services:

  # Reverse Proxy and Load Balancer
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /mnt/nfs_share/traefik_acme:/etc/traefik/acme.json # Shared ACME storage for HA

    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.your-domain.com`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))" # CHANGE THIS
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth@docker"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"
      - "traefik.http.middlewares.auth.basicauth.users=user:$$apr1$$HASHED_PASSWORD" # CHANGE THIS (user:hashed_password)

  # Authelia (SSO)
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    volumes:
      - ./authelia/config:/config
    environment:
      - TZ=Europe/Rome
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.your-domain.com`)" # CHANGE THIS
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls.certresolver=myresolver"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/verify?rd=https://auth.your-domain.com" # CHANGE THIS
      - "traefik.http.middlewares.authelia.forwardauth.authresponseheaders=Remote-User, Remote-Groups, Remote-Name, Remote-Email"

  redis:
    image: redis:alpine
    container_name: redis_authelia
    volumes:
      - ./redis_authelia_data:/data
    restart: unless-stopped

  # Dynamic DNS Client
  ddclient:
    image: linuxserver/ddclient
    container_name: ddclient
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - DDCLIENT_LOGLEVEL=info
      - DDCLIENT_INTERVAL=300
    volumes:
      - ./ddclient/config:/config
    restart: unless-stopped
    network_mode: host

  # Database (Primary)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=your_postgres_password # CHANGE THIS
    volumes:
      - /mnt/nfs_share/postgres_data:/var/lib/postgresql/data # Assume NFS share is mounted on host
    restart: unless-stopped

  # Nextcloud
  nextcloud:
    image: nextcloud:27-apache
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - NEXTCLOUD_TRUSTED_DOMAINS=your-nextcloud-domain.com # CHANGE THIS
      - DB_TYPE=pgsql
      - DB_HOST=postgres
      - DB_NAME=nextcloud
      - DB_USER=nextcloud
      - DB_PASSWORD=your_postgres_password # CHANGE THIS
    volumes:
      - /mnt/nfs_share/nextcloud_data:/var/www/html # Assume NFS share is mounted on host
      - ./nextcloud/config:/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`your-nextcloud-domain.com`)" # CHANGE THIS
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=myresolver"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"

  # Navidrome (Music Server)
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=navidrome.your-domain.com # CHANGE THIS
    volumes:
      - /mnt/nfs_share/navidrome_data:/data # Assume NFS share is mounted on host
      - /mnt/nfs_share/music:/music:ro # Mount your music library here
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`navidrome.your-domain.com`)" # CHANGE THIS
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls.certresolver=myresolver"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"

  # Jellyfin (Media Server)
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /mnt/nfs_share/jellyfin_config:/config # Assume NFS share is mounted on host
      - /mnt/nfs_share/jellyfin_cache:/cache # Assume NFS share is mounted on host
      - /mnt/nfs_share/media:/media:ro # Mount your media library here
    # Add GPU passthrough for hardware transcoding if available
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.your-domain.com`)" # CHANGE THIS
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=myresolver"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  # Audiobookshelf (Audiobook Server)
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - /mnt/nfs_share/audiobookshelf_config:/config # Assume NFS share is mounted on host
      - /mnt/nfs_share/audiobooks:/audiobooks # Mount your audiobooks library here
      - /mnt/nfs_share/podcasts:/podcasts # Mount your podcasts library here
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.your-domain.com`)" # CHANGE THIS
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.tls.certresolver=myresolver"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"

